[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bot-query-classifier"
version = "0.1.0"
description = "Tell apart real search queries from bot traffic"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scikit-learn>=1.3",
]

[tool.setuptools.packages.find]
include = ["bqc*"]
